# Ovoza boti: testlar va Cloudflare'ga avtomatik joylash.
#
# - PR'da va main'da bot/ o'zgarsa: testlar ishlaydi.
# - main'ga kirganda: bot Cloudflare Workers'ga joylanadi va Telegramga ulanadi.
#   Buning uchun repozitoriyada ikkita secret bo'lishi kerak: TELEGRAM_BOT_TOKEN va
#   CLOUDFLARE_API_TOKEN (bot/README.md ga qarang). Secretlar hali qo'shilmagan bo'lsa,
#   joylash bosqichi xatosiz o'tkazib yuboriladi.
name: Bot

on:
  push:
    branches: [main]
    paths:
      - 'bot/**'
      - '.github/workflows/bot.yml'
  pull_request:
    paths:
      - 'bot/**'
      - '.github/workflows/bot.yml'
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash
    working-directory: bot

jobs:
  test:
    name: Testlar
    runs-on: ubuntu-latest
    env:
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: bot/package-lock.json
      - run: npm ci
      - run: npm test
      - name: Cloudflare uchun yig'ib ko'rish
        run: npx wrangler deploy --dry-run --outdir dist

  deploy:
    name: Cloudflare'ga joylash
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: bot-deploy
      cancel-in-progress: false
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      ADMIN_IDS: ${{ secrets.ADMIN_IDS }}
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@v4

      # Kerakli secretlar borligini tekshiradi. CLOUDFLARE_ACCOUNT_ID berilmagan bo'lsa,
      # uni API token orqali o'zi topadi va keyingi qadamlar uchun saqlaydi.
      - name: Sozlamalarni tekshirish
        id: check
        env:
          ACCOUNT_ID_SECRET: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          missing=""
          [ -n "$TELEGRAM_BOT_TOKEN" ] || missing="$missing TELEGRAM_BOT_TOKEN"
          [ -n "$CLOUDFLARE_API_TOKEN" ] || missing="$missing CLOUDFLARE_API_TOKEN"
          if [ -n "$missing" ]; then
            echo "::notice title=Bot joylanmadi::Secretlar yetishmaydi:$missing. bot/README.md dagi 'Ishga tushirish' qadamlarini bajaring."
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          account="$ACCOUNT_ID_SECRET"
          if [ -z "$account" ]; then
            resp=$(curl -sS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/accounts?per_page=50")
            if [ "$(echo "$resp" | jq -r '.success')" != "true" ]; then
              echo "::error title=Cloudflare::API token ishlamadi: $(echo "$resp" | jq -c '.errors'). Tokenni qaytadan nusxalab, CLOUDFLARE_API_TOKEN secretiga qo'ying."
              exit 1
            fi
            count=$(echo "$resp" | jq '.result | length')
            if [ "$count" != "1" ]; then
              echo "::error title=Cloudflare::Token $count ta akkauntga tegishli. Qaysi biri ekanini bilish uchun CLOUDFLARE_ACCOUNT_ID secretini qo'shing."
              exit 1
            fi
            account=$(echo "$resp" | jq -r '.result[0].id')
            echo "Cloudflare akkaunti topildi: $(echo "$resp" | jq -r '.result[0].name')"
          fi
          echo "CLOUDFLARE_ACCOUNT_ID=$account" >> "$GITHUB_ENV"
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        if: steps.check.outputs.ready == 'true'
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: bot/package-lock.json

      - name: Paketlarni o'rnatish
        if: steps.check.outputs.ready == 'true'
        run: npm ci

      # Yangi Cloudflare akkauntida workers.dev manzili bo'lmasa, uni yaratadi
      - name: workers.dev manzili
        if: steps.check.outputs.ready == 'true'
        run: |
          api="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/subdomain"
          auth="Authorization: Bearer $CLOUDFLARE_API_TOKEN"
          resp=$(curl -sS -H "$auth" "$api")
          if [ "$(echo "$resp" | jq -r '.success')" = "true" ]; then
            echo "workers.dev manzili: $(echo "$resp" | jq -r '.result.subdomain').workers.dev"
            exit 0
          fi
          if [ "$(echo "$resp" | jq -r '.errors[0].code // empty')" != "10007" ]; then
            echo "::error title=Cloudflare::API xatosi: $(echo "$resp" | jq -c '.errors'). CLOUDFLARE_API_TOKEN va CLOUDFLARE_ACCOUNT_ID ni tekshiring."
            exit 1
          fi
          name="ovoza-$(printf '%s' "$CLOUDFLARE_ACCOUNT_ID" | cut -c1-8 | tr 'A-Z' 'a-z')"
          echo "workers.dev manzili yo'q, yaratilmoqda: $name.workers.dev"
          created=$(curl -sS -X PUT -H "$auth" -H "Content-Type: application/json" --data "{\"subdomain\":\"$name\"}" "$api")
          if [ "$(echo "$created" | jq -r '.success')" != "true" ]; then
            echo "::error title=Cloudflare::workers.dev manzilini yaratib bo'lmadi: $(echo "$created" | jq -c '.errors'). Cloudflare panelida Workers & Pages bo'limini bir marta oching."
            exit 1
          fi

      - name: Ma'lumotlar bazasi
        if: steps.check.outputs.ready == 'true'
        run: |
          if ! dbs=$(npx wrangler d1 list --json); then
            echo "::error title=Cloudflare::Bazalar ro'yxatini olib bo'lmadi. API tokenda 'D1 — Edit' ruxsati borligini tekshiring (bot/README.md, 2-qadam)."
            exit 1
          fi
          if ! echo "$dbs" | jq -e '.[] | select(.name == "ovoza-db")' > /dev/null; then
            npx wrangler d1 create ovoza-db --update-config=false
          fi
          npx wrangler d1 migrations apply ovoza-db --remote

      - name: Botni joylash
        id: deploy
        if: steps.check.outputs.ready == 'true'
        run: |
          secrets_file="$RUNNER_TEMP/secrets.json"
          trap 'rm -f "$secrets_file"' EXIT
          jq -n --arg token "$TELEGRAM_BOT_TOKEN" --arg admins "$ADMIN_IDS" \
            '{BOT_TOKEN: $token} + (if $admins != "" then {ADMIN_IDS: $admins} else {} end)' > "$secrets_file"
          npx wrangler deploy --secrets-file "$secrets_file" | tee "$RUNNER_TEMP/deploy.log"
          url=$(grep -oE 'https://[a-zA-Z0-9.-]+\.workers\.dev' "$RUNNER_TEMP/deploy.log" | head -1)
          if [ -z "$url" ]; then
            echo "::error title=Cloudflare::Joylangan Worker manzili topilmadi."
            exit 1
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"

      # Webhook, menyu tugmasi, buyruqlar va bot tavsifini sozlaydi
      - name: Telegramga ulash
        if: steps.check.outputs.ready == 'true'
        env:
          APP_URL: ${{ steps.deploy.outputs.url }}
        run: |
          key=$(printf 'ovoza-webhook:%s' "$TELEGRAM_BOT_TOKEN" | sha256sum | cut -c1-48)
          echo "::add-mask::$key"
          for attempt in 1 2 3 4 5 6; do
            if out=$(curl -fsS -X POST "$APP_URL/setup" -H "X-Setup-Key: $key"); then
              bot=$(echo "$out" | jq -r '.bot')
              echo "Bot: https://t.me/$bot"
              {
                echo "### Ovoza boti ishlayapti"
                echo ""
                echo "- Bot: https://t.me/$bot"
                echo "- Mini ilova: $APP_URL/"
              } >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            echo "Bot hali tayyor emas (${attempt}-urinish), 5 soniyadan keyin yana..."
            sleep 5
          done
          echo "::error title=Telegram::Botni ulab bo'lmadi. TELEGRAM_BOT_TOKEN to'g'riligini tekshiring."
          exit 1
