# Miqyos boti: Cloudflare Workers sozlamalari
name = "ovoza-bot"
main = "src/index.js"
compatibility_date = "2025-09-01"
workers_dev = true

# Mini ilova fayllari
[assets]
directory = "./public"
binding = "ASSETS"

# Ma'lumotlar bazasi. database_id yozilmagan: wrangler bazani nomi bo'yicha topadi
# (deploy workflow birinchi marta uni o'zi yaratadi).
[[d1_databases]]
binding = "DB"
database_name = "ovoza-db"
migrations_dir = "migrations"

# Worker ma'lumotlar bazasiga yaqinroq joyda ishlasin: har so'rovdagi bir nechta baza chaqiruvi tezlashadi
[placement]
mode = "smart"

[observability]
enabled = true

# Har daqiqada: yangi reklama e'lonlari haqida mos blogerlarga xabar (src/broadcast.js)
[triggers]
crons = ["* * * * *"]

[vars]
# Maxfiylik siyosati sahifasi (saytda)
PRIVACY_URL = "https://ovozagroup.uz/privacy.html"
# "Ovoza kunlik agent jadvali" ning Apps Script web app'i (src/sheets.js): yangi bloger va bizneslar
# jadvalga "Yangi" holatida yoziladi. Kalit bot tokenidan hosil qilinadi, manzilning o'zi maxfiy emas.
SHEETS_URL = "https://script.google.com/macros/s/AKfycbzWOSiXkTmGtAnMH1J8KDJngMXj5PfdDmphunVWAc1GUW4Xqhzr0C9fjF4mO7Q8j25K/exec"

# Maxfiy qiymatlar (wrangler.toml ga yozilmaydi):
#   BOT_TOKEN  — @BotFather bergan token
#   ADMIN_IDS  — admin Telegram ID'lari (vergul bilan), ixtiyoriy: yangi foydalanuvchi va reklama e'loni
#                xabarlari, e'lonni yopish tugmasi va /stats
