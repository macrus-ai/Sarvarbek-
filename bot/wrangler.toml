# Ovoza boti: Cloudflare Workers sozlamalari
name = "ovoza-bot"
main = "src/index.js"
compatibility_date = "2025-09-01"
workers_dev = true

# Mini ilova fayllari
[assets]
directory = "./public"
binding = "ASSETS"

# Ma'lumotlar bazasi. database_id yozilmagan: wrangler bazani nomi bo'yicha topadi
# (deploy workflow birinchi marta uni o'zi yaratadi).
[[d1_databases]]
binding = "DB"
database_name = "ovoza-db"
migrations_dir = "migrations"

[observability]
enabled = true

[vars]
# Maxfiylik siyosati sahifasi (saytda)
PRIVACY_URL = "https://macrus-ai.github.io/Sarvarbek-/privacy.html"

# Maxfiy qiymatlar (wrangler.toml ga yozilmaydi):
#   BOT_TOKEN  — @BotFather bergan token
#   ADMIN_IDS  — admin Telegram ID'lari (vergul bilan), ixtiyoriy: yangi foydalanuvchi va kampaniya
#                xabarlari, kampaniyani yopish tugmasi va /stats
